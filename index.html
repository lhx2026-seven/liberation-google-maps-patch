<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>解放的Google Maps</title><link rel="stylesheet" href="./style.css"></head><body>
<main><section class="map-panel" aria-label="Google Maps"><div id="google-map" hidden></div><iframe id="map" title="Google Maps 地圖" src="https://maps.google.com/maps?q=台灣&hl=zh-TW&z=7&t=k&output=embed" allowfullscreen loading="eager" referrerpolicy="no-referrer-when-downgrade"></iframe></section>
<button id="toggle-panel" aria-label="收合行程面板" aria-expanded="true">‹</button>
<aside class="sidebar"><div class="toolbar"><span class="route-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 21V10a3 3 0 0 1 3-3h9M15 3l4 4-4 4"/><circle cx="7" cy="20" r="2" fill="white"/></svg></span><input id="trip-name" aria-label="旅程名稱" maxlength="80"><button id="export" title="匯出行程" aria-label="匯出行程"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M5 14v6h14v-6"/></svg></button></div><div class="day-bar"><div id="days" role="tablist" aria-label="行程天數"></div><button id="add-day" aria-label="新增一天" title="新增一天">＋</button></div><div class="day-heading"><span id="day-title"></span><button id="delete-day" class="text-button">刪除此日</button></div><div class="route-content"><div id="stops"></div><form id="add-form"><div class="add-input"><span>＋</span><input id="place" placeholder="新增目的地" aria-label="新增目的地" required maxlength="160" autocomplete="off"><button aria-label="新增停靠點">新增</button></div></form></div><div id="map-status" role="status"></div><button id="settings" class="settings-button">管理員功能</button><div class="panel-footer"><span id="trip-count"></span><span id="save-status">已儲存</span></div></aside></main><dialog id="key-dialog"><form id="key-form"><h2>Google Maps</h2><label for="api-key">API 金鑰</label><input id="api-key" type="password" autocomplete="off" required><p>僅儲存在此瀏覽器。請限制為本站網域，並允許 Maps JavaScript、Places API (New) 與 Routes API。</p><div class="dialog-actions"><button type="button" id="remove-key">移除金鑰</button><button type="button" id="cancel-key">取消</button><button type="submit">連線</button></div></form></dialog><div id="toast" role="status"></div><script src="./app.js"></script></body></html>
