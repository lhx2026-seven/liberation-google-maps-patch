<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="解放地圖"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png"><title>解放的Google Maps</title><link rel="stylesheet" href="./style.css?v=9590693d4d3d"></head><body>
<main><section class="map-panel" aria-label="Google Maps"><div id="google-map" hidden></div><div id="map-recovery"><p id="map-recovery-message">地圖尚未連線</p><button id="reconnect-map" type="button">重新連線</button></div></section>
<button id="toggle-panel" aria-label="收合行程面板" aria-expanded="true">‹</button>
<aside class="sidebar"><div class="toolbar"><span class="route-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 21V10a3 3 0 0 1 3-3h9M15 3l4 4-4 4"/><circle cx="7" cy="20" r="2" fill="white"/></svg></span><button id="trip-overview" type="button" aria-label="顯示全部日程"></button><input id="trip-name" aria-label="旅程名稱" maxlength="80" hidden><button id="edit-trip-name" type="button" title="修改行程名稱" aria-label="修改行程名稱">✎</button><button id="export" title="匯出行程" aria-label="匯出行程"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M5 14v6h14v-6"/></svg></button></div><div class="day-bar"><div id="days" role="tablist" aria-label="行程天數"></div><button id="add-day" aria-label="新增一天" title="新增一天">＋</button></div><div class="day-heading"><span id="day-title"></span><div id="day-actions" class="day-actions"><button id="move-day-before" type="button" title="當天往前移" aria-label="當天往前移">←</button><button id="move-day-after" type="button" title="當天往後移" aria-label="當天往後移">→</button><button id="clear-day" type="button" class="text-button">清空當天</button><button id="delete-day" type="button" class="text-button">刪除此日</button></div></div><div class="route-content"><div id="overview-days" hidden></div><button id="carry-start" type="button" class="carry-start" hidden>帶入前一天終點</button><div id="stops"></div><form id="add-form"><div class="add-input"><input id="place" placeholder="新增目的地" aria-label="新增目的地" required maxlength="160" autocomplete="off"><button aria-label="新增停靠點">新增</button></div></form></div><div id="map-status" role="status"></div><button id="install-app" type="button" class="settings-button">加入主畫面</button><button id="settings" type="button" class="settings-button">管理員功能</button><div class="panel-footer"><span id="trip-count"></span><span id="save-status">已儲存</span></div></aside></main><dialog id="key-dialog"><form id="key-form"><h2>Google Maps</h2><p id="key-state" role="status"></p><label for="api-key">API 金鑰</label><input id="api-key" type="password" autocomplete="new-password" name="maps-api-key" spellcheck="false" autocapitalize="none" required><p>僅儲存在此瀏覽器。請限制為本站網域，並允許 Maps JavaScript、Places API (New) 與 Routes API。</p><div class="dialog-actions"><button type="button" id="remove-key">移除金鑰</button><button type="button" id="cancel-key">取消</button><button type="submit">連線</button></div></form></dialog><dialog id="install-dialog"><h2>安裝到手機</h2><p>iPhone：用 Safari 開啟本站 → 分享 → 加入主畫面 → 加入。</p><p>Android：使用瀏覽器選單的「安裝應用程式」或「加入主畫面」。</p><p>不能從 iOS「檔案」安裝；地圖、搜尋與路線仍需網路。</p><p id="install-status" role="status"></p><button id="close-install" type="button">知道了</button></dialog><div id="offline-notice" role="status" hidden>離線模式：可查看行程，地圖與路線需連網。</div><div id="toast" role="status"></div><script src="./app.js?v=e26a04d329fb"></script><script src="./pwa.js?v=48ad8092e50d"></script></body></html>
