<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地圖行程</title><link rel="stylesheet" href="/style.css"></head><body>
<main><section class="map-panel" aria-label="Google Maps"><iframe id="map" title="Google Maps 地圖" src="https://maps.google.com/maps?q=台北車站&hl=zh-TW&z=14&output=embed" allowfullscreen loading="eager" referrerpolicy="no-referrer-when-downgrade"></iframe></section>
<button id="toggle-panel" aria-label="收合行程面板" aria-expanded="true">‹</button>
<aside class="sidebar"><div class="toolbar"><span class="route-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 21V10a3 3 0 0 1 3-3h9M15 3l4 4-4 4"/><circle cx="7" cy="20" r="2" fill="white"/></svg></span><input id="trip-name" aria-label="旅程名稱" maxlength="80"><button id="export" title="匯出行程" aria-label="匯出行程"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M5 14v6h14v-6"/></svg></button></div><div class="day-bar"><div id="days" role="tablist" aria-label="行程天數"></div><button id="add-day" aria-label="新增一天" title="新增一天">＋</button></div><div class="day-heading"><span id="day-title"></span><button id="delete-day" class="text-button">刪除此日</button></div><div class="route-content"><div id="stops"></div><form id="add-form"><div class="add-input"><span>＋</span><input id="place" placeholder="新增目的地" aria-label="新增目的地" required maxlength="160" autocomplete="off"><button aria-label="新增停靠點">新增</button></div></form></div><div class="panel-footer"><span id="trip-count"></span><span id="save-status">已儲存</span></div></aside></main><div id="toast" role="status"></div><script src="/app.js"></script></body></html>
