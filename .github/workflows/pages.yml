name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: |
          mkdir _site
          cp index.html app.js style.css _site/
          python3 - <<'PYVERSION'
          from pathlib import Path
          import hashlib, re
          page = Path('_site/index.html')
          html = page.read_text()
          for asset in ('app.js', 'style.css'):
              version = hashlib.sha256(Path('_site', asset).read_bytes()).hexdigest()[:12]
              html = re.sub(r'\./' + re.escape(asset) + r'(?:\?v=[^"\s]+)?', './' + asset + '?v=' + version, html)
          page.write_text(html)
          PYVERSION
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
